<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <pattern id="focusGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.04)" stroke-width="1"/>
    </pattern>
    <style>
      .mono-text { font-family: 'SF Mono', Monaco, 'Fira Code', 'Courier New', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="450" fill="#F8FAFC" rx="16"/>
  <rect width="1200" height="450" fill="url(#focusGrid)" rx="16"/>
  <rect x="20" y="20" width="1160" height="410" rx="14" fill="none" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="150" height="24" rx="4" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="10" y="16" class="mono-text" font-size="11" font-weight="700" fill="#10B981" letter-spacing="2">04 // DOMAINS</text>
    <text x="170" y="18" class="sans-text" font-size="18" font-weight="700" fill="#0F172A">Engineering Focus &amp; Core Competencies</text>
    <text x="1120" y="17" text-anchor="end" class="mono-text" font-size="11" fill="#94A3B8">CRAFT &amp; ARCHITECTURE</text>
    <line x1="0" y1="36" x2="1120" y2="36" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1"/>
  </g>

  <!-- Left Column: Engineering Allocation -->
  <g transform="translate(40, 95)">
    <rect width="540" height="250" rx="10" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.2"/>
    <text x="24" y="32" class="mono-text" font-size="12" font-weight="700" fill="#00E5FF" letter-spacing="1.5">ENGINEERING ALLOCATION</text>
    <text x="24" y="52" class="sans-text" font-size="12" fill="#94A3B8">Focus distribution across product delivery lifecycle</text>

    <!-- Bar 1: Frontend Architecture -->
    <g transform="translate(24, 75)">
      <text x="0" y="12" class="sans-text" font-size="12.5" font-weight="600" fill="#0F172A">Frontend Architecture &amp; Component Systems</text>
      <text x="492" y="12" text-anchor="end" class="mono-text" font-size="12" font-weight="700" fill="#00E5FF">40%</text>
      <rect y="20" width="492" height="8" rx="4" fill="#E2E8F0"/>
      <rect y="20" width="197" height="8" rx="4" fill="#00E5FF"/>
    </g>

    <!-- Bar 2: UI Motion & Interaction -->
    <g transform="translate(24, 118)">
      <text x="0" y="12" class="sans-text" font-size="12.5" font-weight="600" fill="#0F172A">Motion, Interaction &amp; Responsive UI</text>
      <text x="492" y="12" text-anchor="end" class="mono-text" font-size="12" font-weight="700" fill="#8B5CF6">25%</text>
      <rect y="20" width="492" height="8" rx="4" fill="#E2E8F0"/>
      <rect y="20" width="123" height="8" rx="4" fill="#8B5CF6"/>
    </g>

    <!-- Bar 3: REST APIs & Services -->
    <g transform="translate(24, 161)">
      <text x="0" y="12" class="sans-text" font-size="12.5" font-weight="600" fill="#0F172A">REST APIs &amp; Application Services</text>
      <text x="492" y="12" text-anchor="end" class="mono-text" font-size="12" font-weight="700" fill="#10B981">20%</text>
      <rect y="20" width="492" height="8" rx="4" fill="#E2E8F0"/>
      <rect y="20" width="98" height="8" rx="4" fill="#10B981"/>
    </g>

    <!-- Bar 4: Data & Cloud Persistence -->
    <g transform="translate(24, 204)">
      <text x="0" y="12" class="sans-text" font-size="12.5" font-weight="600" fill="#0F172A">Data Models, Databases &amp; Cloud Workflows</text>
      <text x="492" y="12" text-anchor="end" class="mono-text" font-size="12" font-weight="700" fill="#F59E0B">15%</text>
      <rect y="20" width="492" height="8" rx="4" fill="#E2E8F0"/>
      <rect y="20" width="74" height="8" rx="4" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Right Column: Core Competency Matrix -->
  <g transform="translate(620, 95)">
    <rect width="540" height="250" rx="10" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1.2"/>
    <text x="24" y="32" class="mono-text" font-size="12" font-weight="700" fill="#8B5CF6" letter-spacing="1.5">PROFESSIONAL COMPETENCIES</text>
    <text x="24" y="52" class="sans-text" font-size="12" fill="#94A3B8">Key engineering principles &amp; methodologies</text>

    <!-- Competency Badges Grid -->
    <g transform="translate(24, 75)">
      <!-- Comp 1 -->
      <rect x="0" y="0" width="235" height="38" rx="6" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1"/>
      <circle cx="16" cy="19" r="4" fill="#00E5FF"/>
      <text x="28" y="23" class="sans-text" font-size="11.5" font-weight="600" fill="#0F172A">Component Reusability</text>

      <!-- Comp 2 -->
      <rect x="250" y="0" width="242" height="38" rx="6" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1"/>
      <circle cx="266" cy="19" r="4" fill="#8B5CF6"/>
      <text x="278" y="23" class="sans-text" font-size="11.5" font-weight="600" fill="#0F172A">Cross-Browser Fidelity</text>

      <!-- Comp 3 -->
      <rect x="0" y="50" width="235" height="38" rx="6" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1"/>
      <circle cx="16" cy="69" r="4" fill="#10B981"/>
      <text x="28" y="73" class="sans-text" font-size="11.5" font-weight="600" fill="#0F172A">Async API State Handling</text>

      <!-- Comp 4 -->
      <rect x="250" y="50" width="242" height="38" rx="6" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1"/>
      <circle cx="266" cy="69" r="4" fill="#F59E0B"/>
      <text x="278" y="73" class="sans-text" font-size="11.5" font-weight="600" fill="#0F172A">Performance Optimization</text>

      <!-- Comp 5 -->
      <rect x="0" y="100" width="235" height="38" rx="6" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1"/>
      <circle cx="16" cy="119" r="4" fill="#EC4899"/>
      <text x="28" y="123" class="sans-text" font-size="11.5" font-weight="600" fill="#0F172A">Responsive Architecture</text>

      <!-- Comp 6 -->
      <rect x="250" y="100" width="242" height="38" rx="6" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1"/>
      <circle cx="266" cy="119" r="4" fill="#00E5FF"/>
      <text x="278" y="123" class="sans-text" font-size="11.5" font-weight="600" fill="#0F172A">Agile Team Collaboration</text>
    </g>
  </g>

  <!-- Bottom Passion & Strategy Bar -->
  <g transform="translate(40, 360)">
    <rect width="1120" height="55" rx="8" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1"/>
    <text x="24" y="32" class="mono-text" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.5">BEYOND CODE:</text>
    
    <!-- Item 1 -->
    <text x="160" y="32" class="sans-text" font-size="12" font-weight="600" fill="#0F172A">♟️ Chess Tactics <tspan fill="#94A3B8" font-weight="400">(Strategic problem solving)</tspan></text>
    <!-- Item 2 -->
    <text x="470" y="32" class="sans-text" font-size="12" font-weight="600" fill="#0F172A">🎨 UI &amp; Interaction Craft <tspan fill="#94A3B8" font-weight="400">(Micro-interactions)</tspan></text>
    <!-- Item 3 -->
    <text x="790" y="32" class="sans-text" font-size="12" font-weight="600" fill="#0F172A">✍️ Creative Writing &amp; Tech Exploration</text>
  </g>
</svg>