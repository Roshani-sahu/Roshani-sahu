<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <pattern id="statsGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(99, 102, 241, 0.04)" stroke-width="1"/>
    </pattern>
    <style>
      .mono-text { font-family: 'SF Mono', Monaco, 'Fira Code', 'Courier New', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="200" fill="#F8FAFC" rx="20"/>
  <rect width="1200" height="200" fill="url(#statsGrid)" rx="20"/>

  <!-- Section Header -->
  <g transform="translate(60, 36)">
    <text x="0" y="14" class="mono-text" font-size="11" font-weight="700" fill="#00E5FF" letter-spacing="2">// 04 — GITHUB TOTAL STATS</text>
    <text x="0" y="38" class="sans-text" font-size="20" font-weight="800" fill="#0F172A">Verified Repository &amp; Activity Statistics</text>
    <text x="1080" y="36" text-anchor="end" class="mono-text" font-size="11" fill="#94A3B8">REAL GITHUB DATA // @Roshani-sahu</text>
  </g>

  <!-- 4 Metric Cards -->
  <g transform="translate(60, 90)">
    <!-- Stat 1 -->
    <g transform="translate(0, 0)">
      <rect width="255" height="85" rx="10" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.18)" stroke-width="1.2"/>
      <rect width="4" height="85" rx="2" fill="#00E5FF"/>
      <text x="20" y="26" class="mono-text" font-size="10.5" font-weight="700" fill="#00E5FF">PUBLIC REPOSITORIES</text>
      <text x="20" y="58" class="sans-text" font-size="32" font-weight="900" fill="#0F172A">25+</text>
      <text x="100" y="56" class="sans-text" font-size="11" fill="#94A3B8">Active Repos</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(275, 0)">
      <rect width="255" height="85" rx="10" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.18)" stroke-width="1.2"/>
      <rect width="4" height="85" rx="2" fill="#8B5CF6"/>
      <text x="20" y="26" class="mono-text" font-size="10.5" font-weight="700" fill="#8B5CF6">PRO EXPERIENCE</text>
      <text x="20" y="58" class="sans-text" font-size="32" font-weight="900" fill="#0F172A">1.5+</text>
      <text x="110" y="56" class="sans-text" font-size="11" fill="#94A3B8">Yrs Frontend</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(550, 0)">
      <rect width="255" height="85" rx="10" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.18)" stroke-width="1.2"/>
      <rect width="4" height="85" rx="2" fill="#EC4899"/>
      <text x="20" y="26" class="mono-text" font-size="10.5" font-weight="700" fill="#EC4899">PRIMARY STACK</text>
      <text x="20" y="58" class="sans-text" font-size="28" font-weight="900" fill="#0F172A">React/TS</text>
      <text x="175" y="56" class="sans-text" font-size="11" fill="#94A3B8">Focused</text>
    </g>

    <!-- Stat 4 -->
    <g transform="translate(825, 0)">
      <rect width="255" height="85" rx="10" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.18)" stroke-width="1.2"/>
      <rect width="4" height="85" rx="2" fill="#10B981"/>
      <text x="20" y="26" class="mono-text" font-size="10.5" font-weight="700" fill="#10B981">LIVE PRODUCTION</text>
      <text x="20" y="58" class="sans-text" font-size="32" font-weight="900" fill="#0F172A">4+</text>
      <text x="80" y="56" class="sans-text" font-size="11" fill="#94A3B8">Client Projects</text>
    </g>
  </g>
</svg>