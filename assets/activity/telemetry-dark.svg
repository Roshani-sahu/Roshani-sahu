<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <pattern id="telemGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1"/>
    </pattern>
    <style>
      .mono-text { font-family: 'SF Mono', Monaco, 'Fira Code', 'Courier New', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" fill="#0B0F19" rx="16"/>
  <rect width="1200" height="320" fill="url(#telemGrid)" rx="16"/>
  <rect x="20" y="20" width="1160" height="280" rx="14" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="155" height="24" rx="4" fill="rgba(0, 229, 255, 0.1)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1"/>
    <text x="10" y="16" class="mono-text" font-size="11" font-weight="700" fill="#00E5FF" letter-spacing="2">05 // TELEMETRY</text>
    <text x="175" y="18" class="sans-text" font-size="18" font-weight="700" fill="#F8FAFC">Developer Activity &amp; Engineering Pulse</text>
    <text x="1120" y="17" text-anchor="end" class="mono-text" font-size="11" fill="#64748B">GITHUB @Roshani-sahu</text>
    <line x1="0" y1="36" x2="1120" y2="36" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1"/>
  </g>

  <!-- 3 Metric Panels -->
  <g transform="translate(40, 95)">
    <!-- Metric 1: Focus Stack -->
    <g transform="translate(0, 0)">
      <rect width="350" height="175" rx="10" fill="#111827" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.2"/>
      <rect width="4" height="175" rx="2" fill="#00E5FF"/>
      <text x="24" y="32" class="mono-text" font-size="11" font-weight="700" fill="#00E5FF" letter-spacing="1">PRIMARY DOMAIN</text>
      <text x="24" y="68" class="sans-text" font-size="28" font-weight="800" fill="#F8FAFC">React &amp; UI</text>
      <text x="24" y="98" class="sans-text" font-size="13" fill="#94A3B8">Frontend Application Architecture</text>
      <text x="24" y="122" class="sans-text" font-size="13" fill="#94A3B8">Tailwind CSS • TypeScript • Vite</text>
      <text x="24" y="152" class="mono-text" font-size="11" fill="#10B981">● ACTIVE DEVELOPMENT</text>
    </g>

    <!-- Metric 2: Full-Stack Integration -->
    <g transform="translate(385, 0)">
      <rect width="350" height="175" rx="10" fill="#111827" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.2"/>
      <rect width="4" height="175" rx="2" fill="#8B5CF6"/>
      <text x="24" y="32" class="mono-text" font-size="11" font-weight="700" fill="#8B5CF6" letter-spacing="1">SERVICES &amp; DATA</text>
      <text x="24" y="68" class="sans-text" font-size="28" font-weight="800" fill="#F8FAFC">MERN Stack</text>
      <text x="24" y="98" class="sans-text" font-size="13" fill="#94A3B8">REST APIs • Node.js • Express</text>
      <text x="24" y="122" class="sans-text" font-size="13" fill="#94A3B8">MongoDB • MySQL • JWT Auth</text>
      <text x="24" y="152" class="mono-text" font-size="11" fill="#8B5CF6">● END-TO-END FLOW</text>
    </g>

    <!-- Metric 3: Engineering Standards -->
    <g transform="translate(770, 0)">
      <rect width="350" height="175" rx="10" fill="#111827" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.2"/>
      <rect width="4" height="175" rx="2" fill="#10B981"/>
      <text x="24" y="32" class="mono-text" font-size="11" font-weight="700" fill="#10B981" letter-spacing="1">STANDARDS &amp; DELIVERY</text>
      <text x="24" y="68" class="sans-text" font-size="28" font-weight="800" fill="#F8FAFC">Production</text>
      <text x="24" y="98" class="sans-text" font-size="13" fill="#94A3B8">Modular Component Systems</text>
      <text x="24" y="122" class="sans-text" font-size="13" fill="#94A3B8">Git Workflows • Cross-Browser QA</text>
      <text x="24" y="152" class="mono-text" font-size="11" fill="#00E5FF">● HIGH-PERFORMANCE CODE</text>
    </g>
  </g>
</svg>