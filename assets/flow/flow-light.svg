          <circle cx="0" cy="0" r="38" fill="#FFFFFF" stroke="#00E5FF" stroke-width="2"/>
          <circle cx="0" cy="0" r="46" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
          
          <!-- Icon -->
