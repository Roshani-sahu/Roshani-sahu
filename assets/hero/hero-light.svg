<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="heroGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(99, 102, 241, 0.05)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(99, 102, 241, 0.05)"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="radialCyan" cx="20%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="radialViolet" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.8)); }
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .floating-card { animation: floatSlow 6s ease-in-out infinite; }
      .beacon { animation: beaconBlink 2.2s infinite ease-in-out; transform-origin: center; }
      .shimmer-line { animation: shimmer 4s infinite linear; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -1.5px;
      }
      .mono-text {
        font-family: 'SF Mono', Monaco, 'Fira Code', 'Courier New', monospace;
      }
      .sans-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="#F8FAFC" rx="16"/>
  <rect width="1200" height="480" fill="url(#heroGrid)" rx="16"/>
  <rect width="1200" height="480" fill="url(#radialCyan)" rx="16"/>
  <rect width="1200" height="480" fill="url(#radialViolet)" rx="16"/>

  <!-- Outer Glass Frame -->
  <rect x="20" y="20" width="1160" height="440" rx="14" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5"/>

  <!-- Corner Tech Accents -->
  <path d="M 20 45 L 20 20 L 45 20" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1180 45 L 1180 20 L 1155 20" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 20 435 L 20 460 L 45 460" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1180 435 L 1180 460 L 1155 460" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Studio / HUD Status Bar -->
  <g transform="translate(45, 42)">
    <!-- Terminal Dots -->
    <circle cx="8" cy="8" r="4.5" fill="#EF4444"/>
    <circle cx="24" cy="8" r="4.5" fill="#F59E0B"/>
    <circle cx="40" cy="8" r="4.5" fill="#10B981"/>
    
    <!-- System Status Badge -->
    <rect x="68" y="-4" width="220" height="24" rx="12" fill="rgba(14, 165, 233, 0.1)" stroke="rgba(14, 165, 233, 0.3)" stroke-width="1"/>
    <circle cx="82" cy="8" r="3.5" fill="#10B981" class="beacon"/>
    <text x="94" y="12" class="mono-text" font-size="11" font-weight="600" fill="#0284C7" letter-spacing="1">SYSTEM READY // ONLINE</text>

    <!-- Location & Experience Metadata -->
    <text x="820" y="12" class="mono-text" font-size="11.5" fill="#94A3B8" letter-spacing="1.2">INDORE, INDIA • 1.5+ YRS PRO EXP</text>
    <rect x="795" y="-4" width="315" height="24" rx="6" fill="none" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1"/>
  </g>

  <!-- Center Identity & Typography -->
  <g transform="translate(60, 100)">
    <!-- Supertitle Category -->
    <g transform="translate(0, 24)">
      <rect x="0" y="-14" width="265" height="22" rx="4" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1"/>
      <text x="10" y="2" class="mono-text" font-size="11" font-weight="700" fill="#8B5CF6" letter-spacing="2">FRONTEND &amp; MERN ENGINEER</text>
    </g>

    <!-- Main Name Headline -->
    <text x="0" y="105" class="title-text" font-size="64" fill="url(#cyanPurpleGrad)">ROSHANI SAHU</text>

    <!-- Subtitle Role -->
    <text x="2" y="150" class="sans-text" font-size="22" font-weight="600" fill="#0F172A" letter-spacing="0.5">
      React Specialist <tspan fill="#8B5CF6">•</tspan> UI Architecture <tspan fill="#00E5FF">•</tspan> Full-Stack Engineering
    </text>

    <!-- Engineering Statement -->
    <text x="2" y="185" class="sans-text" font-size="15" fill="#475569" font-weight="400">
      Engineering high-performance web applications, scalable React component systems,
    </text>
    <text x="2" y="208" class="sans-text" font-size="15" fill="#475569" font-weight="400">
      and fluid motion experiences with modern state and API architecture.
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 240)">
      <!-- Pillar 1 -->
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.2"/>
      <circle cx="20" cy="19" r="5" fill="#00E5FF"/>
      <text x="35" y="23" class="sans-text" font-size="13" font-weight="600" fill="#0F172A">React &amp; TypeScript</text>

      <!-- Pillar 2 -->
      <rect x="180" y="0" width="165" height="38" rx="8" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.2"/>
      <circle cx="200" cy="19" r="5" fill="#8B5CF6"/>
      <text x="215" y="23" class="sans-text" font-size="13" font-weight="600" fill="#0F172A">Tailwind &amp; Motion</text>

      <!-- Pillar 3 -->
      <rect x="360" y="0" width="165" height="38" rx="8" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.2"/>
      <circle cx="380" cy="19" r="5" fill="#10B981"/>
      <text x="395" y="23" class="sans-text" font-size="13" font-weight="600" fill="#0F172A">MERN Full-Stack</text>

      <!-- Pillar 4 -->
      <rect x="540" y="0" width="180" height="38" rx="8" fill="#FFFFFF" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.2"/>
      <circle cx="560" cy="19" r="5" fill="#EC4899"/>
      <text x="575" y="23" class="sans-text" font-size="13" font-weight="600" fill="#0F172A">REST APIs &amp; Dashboards</text>
    </g>
  </g>

  <!-- Right Floating Architecture Visual / Interactive HUD Card -->
  <g transform="translate(820, 110)" class="floating-card">
    <!-- Card Container -->
    <rect width="320" height="295" rx="12" fill="url(#cardGrad)" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1.5"/>
    <rect width="320" height="32" rx="12" fill="rgba(99, 102, 241, 0.12)"/>
    <rect y="24" width="320" height="8" fill="#FFFFFF"/>
    <text x="16" y="21" class="mono-text" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">COMPONENT_PIPELINE.tsx</text>
    
    <!-- Code Simulation / Architecture Flow inside Card -->
    <g transform="translate(16, 48)">
      <!-- Line 1 -->
      <text x="0" y="15" class="mono-text" font-size="12" fill="#8B5CF6">interface <tspan fill="#00E5FF">FrontendEngine</tspan> {</text>
      <text x="14" y="36" class="mono-text" font-size="11.5" fill="#475569">core: <tspan fill="#10B981">'React'</tspan> | <tspan fill="#10B981">'TypeScript'</tspan>;</text>
      <text x="14" y="55" class="mono-text" font-size="11.5" fill="#475569">styling: <tspan fill="#10B981">'TailwindCSS'</tspan>;</text>
      <text x="14" y="74" class="mono-text" font-size="11.5" fill="#475569">motion: <tspan fill="#10B981">'GSAP'</tspan> | <tspan fill="#10B981">'Framer'</tspan>;</text>
      <text x="14" y="93" class="mono-text" font-size="11.5" fill="#475569">backend: <tspan fill="#10B981">'Node'</tspan> | <tspan fill="#10B981">'Express'</tspan>;</text>
      <text x="14" y="112" class="mono-text" font-size="11.5" fill="#475569">database: <tspan fill="#10B981">'MongoDB'</tspan> | <tspan fill="#10B981">'MySQL'</tspan>;</text>
      <text x="0" y="132" class="mono-text" font-size="12" fill="#8B5CF6">}</text>

      <!-- Divider -->
      <line x1="0" y1="145" x2="288" y2="145" stroke="rgba(99, 102, 241, 0.2)" stroke-width="1"/>

      <!-- Live Metric Pill -->
      <g transform="translate(0, 158)">
        <rect width="288" height="64" rx="8" fill="rgba(0, 229, 255, 0.05)" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>
        <text x="12" y="24" class="mono-text" font-size="11" fill="#94A3B8">PRODUCTION IMPACT</text>
        <text x="12" y="48" class="sans-text" font-size="17" font-weight="700" fill="#0F172A">Royal IT Services</text>
        <text x="185" y="48" class="mono-text" font-size="12" font-weight="600" fill="#10B981">4+ APPS LIVE</text>
      </g>
    </g>
  </g>

  <!-- Bottom Animated Energy Beam -->
  <g transform="translate(20, 462)">
    <rect width="1160" height="2" fill="url(#borderGrad)"/>
    <circle cx="580" cy="1" r="3" fill="#00E5FF">
      <animate attributeName="cx" values="50;1110;50" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>